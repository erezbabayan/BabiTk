[build]
  base = "web"
  command = "npm ci && npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_DEMO_MODE = "false"
  VITE_USE_CONVEX = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
