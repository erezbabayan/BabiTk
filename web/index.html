<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.convex.cloud wss://*.convex.cloud https://*.convex.site https://fonts.googleapis.com https://fonts.gstatic.com"
    />
    <!-- Non-blocking fonts: Android often stalls on Google Fonts CDN. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Secular+One&family=Solitreo&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Secular+One&family=Solitreo&display=swap"
      />
    </noscript>
    <style>
      /* Immediate fallbacks so UI paints before remote fonts arrive */
      html, body {
        font-family: Rubik, "Segoe UI", Tahoma, Arial, sans-serif;
      }
    </style>
    <script>
      (function () {
        try {
          var host = location.hostname;
          if (host === "localhost" || host === "127.0.0.1") return;
          var moduleScript = document.querySelector('script[type="module"]');
          var src = (moduleScript && moduleScript.getAttribute("src")) || "";
          var current = src.match(/assets\/index-[A-Za-z0-9_-]+\.js/);
          if (!current) return;
          var root = src.slice(0, src.indexOf("assets/"));
          fetch(root + "app-version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
              if (!data || !data.v) return;
              var prev = localStorage.getItem("babitk:app-version");
              if (prev && prev !== data.v && !sessionStorage.getItem("babitk:version-reload")) {
                sessionStorage.setItem("babitk:version-reload", "1");
                localStorage.setItem("babitk:app-version", data.v);
                var url = new URL(location.href);
                url.searchParams.set("_r", String(Date.now()));
                location.replace(url.toString());
                return;
              }
              localStorage.setItem("babitk:app-version", data.v);
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
