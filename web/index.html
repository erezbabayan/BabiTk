<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>BabiTk</title>
    <!-- Non-blocking fonts: Android often stalls on Google Fonts CDN. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Secular+One&family=Solitreo&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Secular+One&family=Solitreo&display=swap"
      />
    </noscript>
    <style>
      /* Immediate fallbacks so UI paints before remote fonts arrive */
      html, body {
        font-family: Rubik, "Segoe UI", Tahoma, Arial, sans-serif;
      }
    </style>
    <script>
      (function () {
        try {
          var host = location.hostname;
          if (host === "localhost" || host === "127.0.0.1") return;
          var moduleScript = document.querySelector('script[type="module"]');
          var src = (moduleScript && moduleScript.getAttribute("src")) || "";
          var current = src.match(/assets\/index-[A-Za-z0-9_-]+\.js/);
          if (!current) return;
          var root = src.slice(0, src.indexOf("assets/"));
          fetch(root + "app-version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
              if (!data || !data.v) return;
              var running = document.documentElement.getAttribute("data-build");
              var prev = localStorage.getItem("babitk:app-version");
              var stale = (running && running !== data.v) || (prev && prev !== data.v);
              if (stale && !sessionStorage.getItem("babitk:version-reload")) {
                sessionStorage.setItem("babitk:version-reload", "1");
                localStorage.setItem("babitk:app-version", data.v);
                var url = new URL(location.href);
                url.searchParams.set("_r", String(Date.now()));
                location.replace(url.toString());
                return;
              }
              localStorage.setItem("babitk:app-version", data.v);
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
