# For a minimal Supabase CLI config. Link your remote project:
#   npx supabase login
#   npx supabase link --project-ref YOUR_PROJECT_REF
#   npx supabase db push

project_id = "mindtasker"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
