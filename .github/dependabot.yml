version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/", "/backend", "/web", "/mobile"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      security-minor-patch:
        update-types: ["minor", "patch"]
