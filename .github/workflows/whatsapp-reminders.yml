name: WhatsApp reminder dispatch (hourly backup)

# Primary scheduler is pg_cron in Supabase (job "babitk-whatsapp-reminders", every
# 5 minutes; see supabase/migrations/20261023140000_pg_cron_reminders.sql).
# This hourly run is only a backup. The Edge Function takes a single-flight lease
# and every sender is marked once per user/item/day, so an extra run sends nothing twice.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke WhatsApp reminder function
        env:
          FUNCTION_URL: https://ghibfuinantybqidwadj.supabase.co/functions/v1/whatsapp-send-reminders
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_ROLE" ]; then
            echo "Skipping — add GitHub secret SUPABASE_SERVICE_ROLE_KEY to dispatch WhatsApp reminders and digests from CI."
            exit 0
          fi
          curl -fsS -X POST "$FUNCTION_URL" \
            -H "Authorization: Bearer $SERVICE_ROLE" \
            -H "Content-Type: application/json" \
            -d '{}'
