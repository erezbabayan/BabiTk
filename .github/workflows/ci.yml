name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
            mobile/package-lock.json

      - name: Install root deps (Convex integration tests)
        run: npm ci

      - name: Backend install & verify
        working-directory: backend
        env:
          OPENAI_API_KEY: sk-test-ci-placeholder
          NODE_ENV: test
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Web install & verify
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Mobile typecheck and unit tests
        working-directory: mobile
        run: |
          npm ci
          npm test

      - name: Stack smoke checks
        run: node scripts/verify-stack.mjs
