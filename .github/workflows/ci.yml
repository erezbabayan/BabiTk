name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
            mobile/package-lock.json

      - name: Install root deps (Convex integration tests)
        run: npm ci

      - name: Backend install & verify
        working-directory: backend
        env:
          OPENAI_API_KEY: sk-test-ci-placeholder
          NODE_ENV: test
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Web install & verify
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Mobile typecheck and unit tests
        working-directory: mobile
        run: |
          npm ci
          npm test

      - name: Stack smoke checks
        run: node scripts/verify-stack.mjs
