name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
            mobile/package-lock.json

      - name: Install root deps (Convex integration tests)
        run: npm ci

      - name: Backend install & verify
        working-directory: backend
        env:
          OPENAI_API_KEY: sk-test-ci-placeholder
          NODE_ENV: test
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Web install & verify
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Mobile typecheck and unit tests
        working-directory: mobile
        run: |
          npm ci
          npm test

      - name: Mobile release JS bundle
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_DEMO_MODE: "false"
          EXPO_PUBLIC_SUPABASE_URL: https://ghibfuinantybqidwadj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoaWJmdWluYW50eWJxaWR3YWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1Njg0MDksImV4cCI6MjEwNTE0NDQwOX0.WGT54YlYGFugfIRyLHN_pXGYl1ZyfyKtXTLZHl0g7a4
        run: |
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output "$RUNNER_TEMP/babitk.android.bundle" \
            --assets-dest "$RUNNER_TEMP/babitk-android-assets"

      - name: Stack smoke checks
        run: node scripts/verify-stack.mjs
