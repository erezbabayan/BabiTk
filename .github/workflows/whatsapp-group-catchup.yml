name: WhatsApp group inbox catch-up (hourly backup)

# Primary scheduler is pg_cron (job babitk-whatsapp-group-catchup, every 10 min,
# migration 20261023151000_pg_cron_group_catchup.sql). This hourly run only calls
# the same Edge Function, which imports NEW group texts after the per-user
# watermark and dedupes by Green-API message id under a single-flight lease, so
# an extra run can never import old messages or duplicates. Without the
# GROUP_CATCHUP_CRON_SECRET repo secret it is a no-op.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger whatsapp-group-catchup
        env:
          CATCHUP_SECRET: ${{ secrets.GROUP_CATCHUP_CRON_SECRET }}
        run: |
          if [ -z "${CATCHUP_SECRET}" ]; then
            echo "GROUP_CATCHUP_CRON_SECRET not set; pg_cron is the primary scheduler. Skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CATCHUP_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{"source":"github"}' \
            https://ghibfuinantybqidwadj.supabase.co/functions/v1/whatsapp-group-catchup)
          echo "HTTP ${code}"
          jq -c '{ok, skipped, users, inserted, duplicates, errors}' /tmp/out.json || true
          test "${code}" = "200"
