name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "convex/lib/ingest/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:
    inputs:
      supabase_access_token:
        description: "אם הסיקרט חסר — הדביקו כאן טוקן sbp_ מ-https://supabase.com/dashboard/account/tokens"
        required: false
        type: string
      supabase_db_password:
        description: "סיסמת מסד (אופציונלי, למיגרציות)"
        required: false
        type: string
      google_client_id:
        description: "Google OAuth Client ID (...apps.googleusercontent.com)"
        required: false
        type: string
      google_client_secret:
        description: "Google OAuth Client Secret (GOCSPX-...)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Resolve Supabase access token
        id: token
        env:
          SECRET_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          INPUT_TOKEN: ${{ github.event.inputs.supabase_access_token }}
        run: |
          set -euo pipefail
          PROJECT_REF="ghibfuinantybqidwadj"
          TOKEN="${SECRET_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${INPUT_TOKEN:-}"; fi

          token_ok() {
            local t="${1:-}"
            [ -n "$t" ] || return 1
            local code
            code="$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${t}" \
              -H "apikey: ${t}" \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}" || true)"
            echo "token probe HTTP ${code}"
            [ "$code" = "200" ]
          }

          mint_oidc() {
            local REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
            if [ -z "$REQUEST_URL" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "GitHub OIDC is not available in this job."
              return 1
            fi
            local SEP="&"
            case "$REQUEST_URL" in
              *"?"*) ;;
              *) SEP="?" ;;
            esac
            local OIDC_JSON JWT HTTP_CODE BODY minted
            OIDC_JSON="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${REQUEST_URL}${SEP}audience=babitk-github-oidc")"
            JWT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
            BODY="$(mktemp)"
            HTTP_CODE="$(curl -sS -o "$BODY" -w "%{http_code}" -X POST \
              "https://${PROJECT_REF}.supabase.co/functions/v1/github-oidc-mint" \
              -H "Authorization: Bearer ${JWT}" \
              -H "Content-Type: application/json" || true)"
            echo "OIDC mint HTTP ${HTTP_CODE}"
            minted="$(python3 -c 'import json,sys
try:
    data=json.load(sys.stdin)
except Exception:
    data={}
print(data.get("access_token") or "")' <"$BODY")"
            if [ -z "$minted" ]; then
              python3 -c 'import json,re,sys
raw=sys.stdin.read()
try:
    data=json.loads(raw)
    print("mint error:", data.get("error") or list(data)[:8])
except Exception:
    print(re.sub(r"sbp_[A-Za-z0-9]+", "sbp_[redacted]", raw)[:800])' <"$BODY"
              rm -f "$BODY"
              return 1
            fi
            rm -f "$BODY"
            printf '%s' "$minted"
          }

          if ! token_ok "$TOKEN"; then
            if [ -n "$TOKEN" ]; then
              echo "::warning::Stored SUPABASE_ACCESS_TOKEN was rejected; trying GitHub OIDC mint."
            fi
            TOKEN=""
            for attempt in 1 2 3 4; do
              set +e
              MINTED="$(mint_oidc)"
              MINT_STATUS=$?
              set -e
              if [ "$MINT_STATUS" -eq 0 ] && [ -n "$MINTED" ]; then
                TOKEN="$MINTED"
                break
              fi
              echo "OIDC mint attempt ${attempt} failed; retrying..."
              sleep $((attempt * 8))
            done
            if [ -z "$TOKEN" ]; then
              echo "::error::Could not mint a Supabase token via GitHub OIDC."
              exit 1
            fi
            # A minted PAT can still deploy even if the account probe is picky.
            if ! token_ok "$TOKEN"; then
              echo "::warning::Minted token did not pass the Management API probe; continuing to functions deploy."
            fi
          fi
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Deploy Edge Functions and schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.token.outputs.value }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || github.event.inputs.supabase_db_password }}
          PROJECT_REF: ghibfuinantybqidwadj
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          GOOGLE_CLIENT_ID: ${{ github.event.inputs.google_client_id || secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ github.event.inputs.google_client_secret || secrets.GOOGLE_CLIENT_SECRET }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty — schema and Edge Functions were NOT deployed."
            exit 1
          fi
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
            npx supabase db push --yes
          else
            echo "::warning::SUPABASE_DB_PASSWORD is empty — migrations were not pushed. Functions will still deploy."
          fi
          if [ -n "${GOOGLE_CLIENT_ID:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_ID"; fi
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"; fi
          sync_secret() {
            local name="$1"
            local value="${2:-}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              npx supabase secrets set --project-ref "$PROJECT_REF" "${name}=${value}" >/dev/null
              echo "synced $name"
            else
              echo "skip $name (not in GitHub secrets)"
            fi
          }
          sync_secret GROQ_API_KEY "${GROQ_API_KEY:-}"
          sync_secret OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          sync_secret GEMINI_API_KEY "${GEMINI_API_KEY:-}"
          sync_secret RUNPOD_API_KEY "${RUNPOD_API_KEY:-}"
          sync_secret RUNPOD_ENDPOINT_ID "${RUNPOD_ENDPOINT_ID:-}"
          sync_secret GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID:-${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:-}}"
          sync_secret GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET:-${SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET:-${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET:-}}}"
          sync_secret GITHUB_OIDC_DEPLOY_TOKEN "${SUPABASE_ACCESS_TOKEN:-}"
          npx supabase functions deploy whatsapp-green-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy transcribe-voice-item --project-ref "$PROJECT_REF"
          npx supabase functions deploy whatsapp-green-connect --project-ref "$PROJECT_REF"
          npx supabase functions deploy whatsapp-send-reminders --project-ref "$PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy ingest-voice --project-ref "$PROJECT_REF"
          npx supabase functions deploy ingest-notebook --project-ref "$PROJECT_REF"
          npx supabase functions deploy github-oidc-mint --project-ref "$PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy google-calendar --project-ref "$PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy google-login --project-ref "$PROJECT_REF" --no-verify-jwt
          SUPABASE_PROJECT_REF="$PROJECT_REF" node "$GITHUB_WORKSPACE/scripts/configure-supabase-auth.mjs"

