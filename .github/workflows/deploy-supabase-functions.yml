name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "convex/lib/ingest/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:
    inputs:
      supabase_access_token:
        description: "אם הסיקרט חסר — הדביקו כאן טוקן sbp_ מ-https://supabase.com/dashboard/account/tokens"
        required: false
        type: string
      supabase_db_password:
        description: "סיסמת מסד (אופציונלי, למיגרציות)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Resolve Supabase access token
        id: token
        env:
          SECRET_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          INPUT_TOKEN: ${{ github.event.inputs.supabase_access_token }}
        run: |
          set -euo pipefail
          TOKEN="${SECRET_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${INPUT_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}"
            SEP="&"
            case "$REQUEST_URL" in
              *"?"*) ;;
              *) SEP="?" ;;
            esac
            OIDC_JSON="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${REQUEST_URL}${SEP}audience=babitk-github-oidc")"
            JWT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
            RESP="$(curl -sS -X POST \
              "https://ghibfuinantybqidwadj.supabase.co/functions/v1/github-oidc-mint" \
              -H "Authorization: Bearer ${JWT}" \
              -H "Content-Type: application/json")"
            TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token") or "")' <<<"$RESP")"
            if [ -z "$TOKEN" ]; then
              echo "::error::Could not mint a Supabase token via GitHub OIDC."
              python3 -c 'import re,sys; print(re.sub(r"sbp_[A-Za-z0-9]+", "sbp_[redacted]", sys.stdin.read())[:800])' <<<"$RESP"
              exit 1
            fi
          fi
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Deploy Edge Functions and schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.token.outputs.value }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || github.event.inputs.supabase_db_password }}
          PROJECT_REF: ghibfuinantybqidwadj
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty — schema and Edge Functions were NOT deployed."
            exit 1
          fi
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
            npx supabase db push --yes
          else
            echo "::warning::SUPABASE_DB_PASSWORD is empty — migrations were not pushed. Functions will still deploy."
          fi
          sync_secret() {
            local name="$1"
            local value="${2:-}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              npx supabase secrets set --project-ref "$PROJECT_REF" "${name}=${value}" >/dev/null
              echo "synced $name"
            else
              echo "skip $name (not in GitHub secrets)"
            fi
          }
          sync_secret GROQ_API_KEY "${GROQ_API_KEY:-}"
          sync_secret OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          sync_secret RUNPOD_API_KEY "${RUNPOD_API_KEY:-}"
          sync_secret RUNPOD_ENDPOINT_ID "${RUNPOD_ENDPOINT_ID:-}"
          sync_secret GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID:-}"
          sync_secret GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET:-}"
          npx supabase functions deploy whatsapp-green-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy transcribe-voice-item --project-ref "$PROJECT_REF"
          npx supabase functions deploy whatsapp-green-connect --project-ref "$PROJECT_REF"
          npx supabase functions deploy whatsapp-send-reminders --project-ref "$PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy ingest-voice --project-ref "$PROJECT_REF"
          npx supabase functions deploy github-oidc-mint --project-ref "$PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy google-calendar --project-ref "$PROJECT_REF" --no-verify-jwt
          SUPABASE_PROJECT_REF="$PROJECT_REF" node "$GITHUB_WORKSPACE/scripts/configure-supabase-auth.mjs"

